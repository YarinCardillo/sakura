[workspace]
resolver = "2"
members = ["crates/sakura-core", "crates/sakura-terminal", "crates/sakura-acp", "crates/sakura-app"]

[workspace.package]
version = "0.4.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "symbols"
