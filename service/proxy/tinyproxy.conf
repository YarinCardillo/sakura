# Egress proxy for agent containers. One thing passes: a tunnel (CONNECT) to port 443 of a
# name on the allow list. Everything is denied unless the request target matches a line of
# allow.txt (anchored extended regular expressions, one per line, each "<name>:443").
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Warning
DisableViaHeader Yes

Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterDefaultDeny Yes
FilterCaseSensitive Off
# The filter is applied to the whole request target, not to the host alone. The target of a
# tunnel is "<name>:<port>" and matches its line of allow.txt only with port 443. The target
# of an ordinary HTTP request ("GET http://name:22/") begins with "http://" and matches no
# line: ordinary forwarding is refused, to any port. (ConnectPort alone bounds tunnels only.)
FilterURLs On

# HTTPS tunnels to port 443 only. No SSH, no other ports.
ConnectPort 443
