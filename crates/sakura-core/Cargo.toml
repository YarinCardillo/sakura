[package]
name = "sakura-core"
version = "0.1.0"
description = "Sakura desk core: box runner, validation, machine facts, watcher and terminals, with no UI dependency"
edition = "2021"
rust-version = "1.77"
publish = false

[features]
# `test_support`, for the tests of the crates built on this one.
test-support = []

[dependencies]
libc = "0.2.191"
notify = "8.2.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Addresses printed by a terminal are parsed, never matched as text (already in the tree through GPUI).
url = "2.5"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "process", "io-util", "time", "macros", "net", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
